<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casual 19 Maps - TribalWars Maps</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
    <div class="container">
        <h1><a href="index.html">TribalWars Maps <span class="attribution">by Superdog</span></a></h1>
        <p>Daily map updates for the TribalWars browser game</p>
    </div>
</header>

    <nav class="world-nav">
    <div class="container">
        <div class="world-category-picker">
            <label for="world-category">World type</label>
            <select id="world-category" data-default-category="casual">
                <option value="regular">Regular worlds</option>
                <option value="casual">Casual worlds</option>
                <option value="special">Special worlds</option>
            </select>
        </div>
        <div class="world-buttons">
            <a href="en153.html" class="world-btn" data-world-category="regular">World 153</a>
            <a href="en154.html" class="world-btn" data-world-category="regular">World 154</a>
            <a href="en155.html" class="world-btn" data-world-category="regular">World 155</a>
            <a href="en156.html" class="world-btn" data-world-category="regular">World 156</a>
            <a href="enc1.html" class="world-btn" data-world-category="special">Classic</a>
            <a href="enc2.html" class="world-btn" data-world-category="special">High Performance</a>
            <a href="enp17.html" class="world-btn" data-world-category="casual">Casual 17</a>
            <a href="enp18.html" class="world-btn" data-world-category="casual">Casual 18</a>
            <a href="enp19.html" class="world-btn is-current" data-world-category="casual" aria-current="page">Casual 19</a>
        </div>
    </div>
</nav>
<script>
    (() => {
        const categoryPicker = document.querySelector('#world-category');
        const worldButtons = document.querySelectorAll('[data-world-category]');

        if (!categoryPicker || worldButtons.length === 0) return;

        function showCategory(category) {
            worldButtons.forEach(button => {
                button.hidden = button.dataset.worldCategory !== category;
            });
        }

        categoryPicker.value = categoryPicker.dataset.defaultCategory || 'regular';
        showCategory(categoryPicker.value);
        categoryPicker.addEventListener('change', event => showCategory(event.target.value));
    })();
</script>

    <main>
    <div class="container">
        <div class="map-grid" id="mapContainer">
            <div class="loading">
                <p>Loading maps...</p>
            </div>
        </div>
    </div>
</main>
    <footer>
    <div class="container">
        <p>&copy; 2026 SuperdogMaps. Tribal Wars&trade; is a trademark of InnoGames GmbH.</p>
    </div>
</footer>

    <script>window.currentWorld = "enp19";</script>
    <script src="script.js"></script>
</body>
</html>
